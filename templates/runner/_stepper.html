{# Run flow: 1 Parameters → 2 Review → 3 Execute. `step` is 1 or 2. #}
<ol class="stepper" aria-label="Run steps">
  <li class="{% if step == 1 %}is-current{% else %}is-done{% endif %}"{% if step == 1 %} aria-current="step"{% endif %}><span class="n">{% if step > 1 %}✓{% else %}1{% endif %}</span><span class="s-label">Parameters</span></li>
  <li class="{% if step == 2 %}is-current{% endif %}"{% if step == 2 %} aria-current="step"{% endif %}><span class="n">2</span><span class="s-label">Review</span></li>
  <li><span class="n">3</span><span class="s-label">Execute</span></li>
</ol>
