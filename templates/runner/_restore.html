{# Restore a backup (runtime/backups/<id>/): "Restore previous" = the newest; "Versions…" picks any. What is
   there now is backed up first, so a restore can be undone. Hidden when there is no backup. id="restore-form":
   designer.js swaps it for the fresh one after an in-place save. #}
<form method="post" action="{% url 'script_restore' script.id %}" id="restore-form" class="restore-form"
      data-confirm="Put back this version of {{ script.path.name }}? What you have now is kept as a backup."{% if not backup_versions %} hidden{% endif %}>{% csrf_token %}
  <button class="btn btn-ghost btn-sm" type="submit" name="previous" value="1" title="Restore the previous version"><svg class="i"><use href="#i-refresh"/></svg> <span class="hide-sm">Restore previous</span></button>
  <select class="input input-sm restore-pick" name="version" aria-label="Restore an earlier version" title="Restore an earlier version" data-restore-pick>
    <option value="">Versions…</option>
    {% for v in backup_versions %}<option value="{{ v.name }}">{{ v.when }} · {{ v.size|filesizeformat }}</option>{% endfor %}
  </select>
</form>
