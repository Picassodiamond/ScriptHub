<div class="table-wrap">
<table class="table table-dense">
  <thead><tr><th>Run</th>{% if show_name %}<th>Sequence</th>{% endif %}<th>Status</th><th class="num">Steps</th><th class="hide-sm">Started</th><th class="num">Duration</th></tr></thead>
  <tbody>
    {% for r in runs %}
    <tr>
      <td class="mono small"><a href="{% url 'sequence_run' r.id %}">{{ r.id }}</a></td>
      {% if show_name %}<td class="strong">{{ r.name }}</td>{% endif %}
      <td><span class="st st-{{ r.status }}">{{ r.status_label }}</span></td>
      <td class="num mono small">{{ r.done }}/{{ r.steps|length }}</td>
      <td class="small muted mono nowrap hide-sm">{{ r.started_display }}</td>
      <td class="num mono small">{{ r.duration }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
