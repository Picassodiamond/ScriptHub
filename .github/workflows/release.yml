name: release

# Pushing a version tag (v2.0, v2.1.3, ...) builds the portable Windows download and attaches it to
# that tag's GitHub Release (created with generated notes if it does not exist yet). Run it by hand
# (Actions > release > Run workflow) to attach the download to an existing tag again.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v2.0"
        required: true

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check ScriptHub-<version>-windows-portable.zip
        shell: bash
        run: python tools/build_portable.py --version "$TAG" --check
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "ScriptHub ${TAG#v}" --generate-notes --verify-tag
          gh release upload "$TAG" dist/ScriptHub-*-windows-portable.zip --clobber
