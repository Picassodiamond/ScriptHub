name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test suite
        run: python manage.py test runner
      - name: Highlighter tests
        run: node tools/test_highlight.js
      - name: Tests left no state behind
        shell: bash
        run: |
          left=$(find runtime/executions runtime/presets -mindepth 1 ! -name .gitkeep; find scripts -name '*.params.json')
          if [ -n "$left" ]; then echo "Left behind by the tests:"; echo "$left"; exit 1; fi
